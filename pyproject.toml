[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "snackstack"
version = "0.1.0"
description = "Voice-enabled Multi-Agent Food Delivery Assistant powered by LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "langchain",
    "langchain-openai",
    "langchain-community",
    "chromadb",
    "openai",
    "pydantic",
    "python-dotenv",
    "sounddevice",
    "soundfile",
    "numpy"
]

[project.scripts]
snackstack = "snackstack.main:main"
